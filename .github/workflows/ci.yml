name: ci

# Pull-request gate: run the full verification suite plus a build-only Docker
# validation (no push) to catch Dockerfile breakage before merge.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Validate the native amd64 build only. The full multi-arch (amd64+arm64)
      # build happens on release; the emulated arm64 leg is slow and adds little
      # Dockerfile-breakage signal for a static CGO_ENABLED=0 GOOS=linux build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
